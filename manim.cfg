# Global manim CLI config: make the native command line (uv run manim ...)
# write output into artifacts/media, consistent with rendering.py.
#
# NOTE: keep this file ASCII-only. manim reads it with configparser without
# an explicit encoding, so on a Chinese Windows locale it is decoded as GBK
# and any UTF-8 Chinese comment here crashes "import manim" with
# UnicodeDecodeError (fixed 2026-10-07; write explanations in the README).
[CLI]
media_dir = artifacts/media
